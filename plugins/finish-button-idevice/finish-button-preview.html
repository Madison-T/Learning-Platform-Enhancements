<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Finish Button iDevice - Preview</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Load Export CSS -->
    <link rel="stylesheet" href="export/finish-button-idevice.css">

    <!-- Load jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="container">

    <!-- Edition Mode -->
    <div id="editorView">
        <h2>🛠️ Edit Mode (Edition)</h2>
        <textarea class="jsContentEditor" placeholder="Add your content here"></textarea>
        <div id="editorOutput"></div>
        <button id="toPreview">Save & Preview</button>
    </div>

    <!-- Export Mode -->
    <div id="previewView" class="hidden">
        <h2>🚀 Export Mode (Published)</h2>
        <div id="exportOutput" class="iDevice_content"></div>
        <button id="toEditor">🔙 Back to Edit Mode</button>
    </div>

</div>

<!-- Load Edition JavaScript -->
<script src="edition/finish-button-idevice.js"></script>

<script>
    let savedOutputHtml = ""; // Store the output generated by save() function

    $(function () {
        // Initialize Edition Mode JS if it exists
        if (typeof $exeDevice !== "undefined" && typeof $exeDevice.init === "function") {
            $exeDevice.init();
        }

        // Switch to Export Mode
        $("#toPreview").on("click", function () {
            if (typeof $exeDevice.save === "function") {
                savedOutputHtml = $exeDevice.save();
                $("#exportOutput").html(savedOutputHtml);

                // Dynamically load Export Mode JS only once
                if (!window.exportScriptLoaded) {
                    const script = document.createElement("script");
                    script.src = "export/finish-button-idevice.js";
                    document.body.appendChild(script);
                    window.exportScriptLoaded = true;
                }

                $("#editorView").hide();
                $("#previewView").show();
            }
        });

        // Switch back to Edition Mode
        $("#toEditor").on("click", function () {
            $("#previewView").hide();
            $("#editorView").show();
            $("#exportOutput").empty();
        });
    });
</script>

</body>
</html>
